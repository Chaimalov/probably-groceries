name: ProbablyGroceries
options:
  bundleIdPrefix: com.chaimalov
  deploymentTarget:
    iOS: "27.0"
targets:
  ProbablyGroceries:
    type: application
    platform: iOS
    sources:
      - App
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Probably
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chaimalov.probablygroceries
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
  ProbablyGroceriesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/ProbablyGroceriesUITests.swift
    dependencies:
      - target: ProbablyGroceries
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chaimalov.probablygroceries.uitests
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  ProbablyGroceriesPredictionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/PredictionEngineTests.swift
      - App/Models.swift
      - App/PredictionEngine.swift
      - App/ShoppingRouteOrder.swift
    dependencies:
      - target: ProbablyGroceries
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chaimalov.probablygroceries.predictiontests
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
