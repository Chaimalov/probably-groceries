name: ProbablyGroceries
options:
  bundleIdPrefix: com.chaimalov
  deploymentTarget:
    iOS: "27.0"
targets:
  ProbablyGroceries:
    type: application
    platform: iOS
    sources:
      - App
    entitlements:
      path: App/ProbablyGroceries.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.chaimalov.probablygroceries
        com.apple.developer.icloud-services:
          - CloudKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: קניות
        CFBundleDevelopmentRegion: he
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        CKSharingSupported: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chaimalov.probablygroceries
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: Groceries
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
  ProbablyGroceriesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/ProbablyGroceriesUITests.swift
    dependencies:
      - target: ProbablyGroceries
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chaimalov.probablygroceries.uitests
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  ProbablyGroceriesPredictionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/PredictionEngineTests.swift
      - Tests/SyncJournalTests.swift
      - App/Models.swift
      - App/PredictionEngine.swift
      - App/ShoppingRouteOrder.swift
      - App/SyncJournal.swift
      - App/SharedListBinding.swift
      - Tests/SharedListBindingTests.swift
    dependencies:
      - target: ProbablyGroceries
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chaimalov.probablygroceries.predictiontests
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
