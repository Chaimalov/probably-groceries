name: ProbablyGroceries
options:
  bundleIdPrefix: com.chaimalov
  deploymentTarget:
    iOS: "27.0"
targets:
  ProbablyGroceries:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      - Resources/Groceries.icon
    dependencies:
      - target: GroceryWidgets
        embed: true
      - target: GroceriesWatch
        embed: true
    entitlements:
      path: App/ProbablyGroceries.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.chaimalov.probablygroceries
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.security.application-groups:
          - group.com.chaimalov.probablygroceries
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: קניות
        CFBundleDevelopmentRegion: he
        CFBundleLocalizations: [he, en]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSCameraUsageDescription: צילום מוצר כדי לעזור לזהות אותו ברשימת הקניות
        CKSharingSupported: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - probablygroceries
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chaimalov.probablygroceries
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: Groceries
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
  GroceriesWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - Watch
      - Shared/WatchShopping.swift
      - Shared/GroceryWidgetSnapshot.swift
      - Resources/Groceries.icon
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: קניות
        CFBundleDevelopmentRegion: he
        CFBundleLocalizations: [he, en]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.chaimalov.probablygroceries
        WKRunsIndependentlyOfCompanionApp: false
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chaimalov.probablygroceries.watchkitapp
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: Groceries
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SKIP_INSTALL: YES
  GroceryWidgets:
    type: app-extension
    platform: iOS
    sources:
      - Widgets
      - Shared
    entitlements:
      path: Widgets/GroceryWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.chaimalov.probablygroceries
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: קניות
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        PRODUCT_BUNDLE_IDENTIFIER: com.chaimalov.probablygroceries.widgets
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SKIP_INSTALL: YES
        SWIFT_VERSION: 5.0
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
  ProbablyGroceriesUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests/ProbablyGroceriesUITests.swift
    dependencies:
      - target: ProbablyGroceries
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chaimalov.probablygroceries.uitests
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
  ProbablyGroceriesPredictionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/ShoppingDraftTests.swift
      - App/ShoppingDraft.swift
      - App/ShoppingSession.swift
      - Tests/PredictionEngineTests.swift
      - Tests/PredictionDiagnosticsTests.swift
      - App/PredictionDiagnostics.swift
      - Tests/SyncJournalTests.swift
      - App/Models.swift
      - App/ProductLearning.swift
      - Tests/ProductLearningTests.swift
      - App/PredictionEngine.swift
      - App/ShoppingRouteOrder.swift
      - App/SyncJournal.swift
      - App/SharedListBinding.swift
      - Tests/SharedListBindingTests.swift
      - Shared/WidgetPage.swift
      - Shared/GroceryWidgetSnapshot.swift
      - Tests/WidgetDataTests.swift
      - Shared/WatchShopping.swift
      - Tests/WatchShoppingTests.swift
    dependencies:
      - target: ProbablyGroceries
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chaimalov.probablygroceries.predictiontests
        SWIFT_VERSION: 5.0
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO

schemes:
  GroceriesWatch:
    build:
      targets:
        GroceriesWatch: all
    run:
      config: Debug
  ProbablyGroceries:
    build:
      targets:
        ProbablyGroceries: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ProbablyGroceriesPredictionTests
        - ProbablyGroceriesUITests
  ProbablyGroceriesUI:
    build:
      targets:
        ProbablyGroceries: all
        ProbablyGroceriesUITests: [test]
    run:
      config: Debug
      executable: ProbablyGroceries
      debugEnabled: false
    test:
      config: Debug
      debugEnabled: false
      targets:
        - ProbablyGroceriesUITests


