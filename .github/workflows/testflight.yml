name: Upload to TestFlight
"on":
  workflow_dispatch:

jobs:
  upload:
    runs-on: xcode-27
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4
      - name: Check signing configuration
        run: |
          if [[ -z "$APPLE_TEAM_ID" || -z "$APPLE_KEY_ID" || -z "$APPLE_ISSUER_ID" || -z "$APPLE_KEY_P8" ]]; then
            echo 'Set APPLE_TEAM_ID (variable) and APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_P8 (secrets) first.' >&2
            exit 1
          fi
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Prepare App Store Connect credentials
        run: |
          printf '%s' "$APPLE_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive for iPhone
        run: |
          xcodebuild archive \
            -project ProbablyGroceries.xcodeproj \
            -scheme ProbablyGroceries \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/ProbablyGroceries.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPLE_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_ISSUER_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
      - name: Upload to App Store Connect
        run: |
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path

          options = {
              'method': 'app-store-connect',
              'destination': 'upload',
              'signingStyle': 'automatic',
              'teamID': os.environ['APPLE_TEAM_ID'],
          }
          with (Path(os.environ['RUNNER_TEMP']) / 'ExportOptions.plist').open('wb') as f:
              plistlib.dump(options, f)
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ProbablyGroceries.xcarchive" \
            -exportPath "$RUNNER_TEMP/TestFlight" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$APPLE_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_ISSUER_ID"
      - name: Remove temporary credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
