name: Upload to TestFlight
'on':
  workflow_dispatch:
    inputs:
      existing_build:
        description: 'Distribute an existing build without rebuilding (leave empty for a new build)'
        required: false
        type: string
  workflow_run:
    workflows:
    - iOS build
    types:
    - completed
    branches:
    - main
concurrency:
  group: testflight-upload
  cancel-in-progress: false
jobs:
  upload:
    if: |-
      (github.event_name == 'workflow_dispatch' && inputs.existing_build == '') || (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: xcode-27
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APPLE_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}
        persist-credentials: false
    - name: Check signing configuration
      run: |
        if [[ -z "$APPLE_TEAM_ID" || -z "$APPLE_KEY_ID" || -z "$APPLE_ISSUER_ID" || -z "$APPLE_KEY_P8" ]]; then
          echo 'Set APPLE_TEAM_ID (variable) and APPLE_API_KEY_ID, APPLE_API_ISSUER_ID, APPLE_API_KEY_P8 (secrets) first.' >&2
          exit 1
        fi
    - name: Validate Apple authentication before building
      run: |
        set +x
        umask 077
        printf '%s' "$APPLE_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
        python3 - <<'PY'
        import sys
        import urllib.error
        sys.path.insert(0, 'scripts')
        from wait_for_testflight import get
        try:
            get('/v1/apps', {'filter[bundleId]': 'com.chaimalov.probablygroceries', 'limit': '1'})
            print('Apple API authentication verified.')
            get('/v1/profiles', {'limit': '1'})
            print('Apple provisioning API access verified.')
        except urllib.error.HTTPError as error:
            print(f'::error::Apple API rejected deployment credentials: HTTP {error.code}.')
            print('Check that APPLE_API_KEY_ID, APPLE_API_ISSUER_ID and APPLE_API_KEY_P8 belong to the same active team key.')
            raise SystemExit(1)
        PY
    - name: Generate Xcode project
      run: |
        command -v xcodegen >/dev/null || brew install xcodegen
        xcodegen generate
    - name: Prepare App Store Connect credentials
      run: |
        printf '%s' "$APPLE_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
        chmod 600 "$RUNNER_TEMP/AuthKey.p8"
    - name: Archive for iPhone
      run: |
        xcodebuild archive \
          -project ProbablyGroceries.xcodeproj \
          -scheme ProbablyGroceries \
          -configuration Release \
          -destination 'generic/platform=iOS' \
          -archivePath "$RUNNER_TEMP/ProbablyGroceries.xcarchive" \
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
          CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
          CODE_SIGNING_ALLOWED=NO
        codesign --force --sign - \
          --entitlements Widgets/GroceryWidgets.entitlements \
          "$RUNNER_TEMP/ProbablyGroceries.xcarchive/Products/Applications/ProbablyGroceries.app/PlugIns/GroceryWidgets.appex"
        codesign --force --sign - \
          "$RUNNER_TEMP/ProbablyGroceries.xcarchive/Products/Applications/ProbablyGroceries.app/Watch/GroceriesWatch.app"
        codesign --force --sign - \
          --entitlements App/ProbablyGroceries.entitlements \
          "$RUNNER_TEMP/ProbablyGroceries.xcarchive/Products/Applications/ProbablyGroceries.app"
    - name: Upload to App Store Connect
      run: |
        python3 - <<'PY'
        import os
        import plistlib
        from pathlib import Path


        options = {
            'method': 'app-store-connect',
            'destination': 'upload',
            'signingStyle': 'automatic',
            'teamID': os.environ['APPLE_TEAM_ID'],
        }
        with (Path(os.environ['RUNNER_TEMP']) / 'ExportOptions.plist').open('wb') as f:
            plistlib.dump(options, f)
        options['destination'] = 'export'
        with (Path(os.environ['RUNNER_TEMP']) / 'InspectOptions.plist').open('wb') as f:
            plistlib.dump(options, f)
        PY
        xcodebuild -exportArchive \
          -archivePath "$RUNNER_TEMP/ProbablyGroceries.xcarchive" \
          -exportPath "$RUNNER_TEMP/SignedExport" \
          -exportOptionsPlist "$RUNNER_TEMP/InspectOptions.plist" \
          -allowProvisioningUpdates \
          -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
          -authenticationKeyID "$APPLE_KEY_ID" \
          -authenticationKeyIssuerID "$APPLE_ISSUER_ID"
        ipa="$RUNNER_TEMP/SignedExport/ProbablyGroceries.ipa"
        unzip -q "$ipa" -d "$RUNNER_TEMP/SignedApp"
        app="$RUNNER_TEMP/SignedApp/Payload/ProbablyGroceries.app"
        codesign --verify --strict "$app"
        widget="$app/PlugIns/GroceryWidgets.appex"
        test -d "$widget" || { echo 'Widget extension missing from IPA' >&2; exit 1; }
        codesign --verify --strict "$widget"
        watch="$app/Watch/GroceriesWatch.app"
        test -d "$watch" || { echo 'Watch companion missing from IPA' >&2; exit 1; }
        codesign --verify --strict "$watch"
        /usr/libexec/PlistBuddy -c 'Print :WKCompanionAppBundleIdentifier' "$watch/Info.plist" | grep -qx 'com.chaimalov.probablygroceries' 
        codesign -d --entitlements :- "$widget" > "$RUNNER_TEMP/widget-entitlements.plist"
        codesign -d --entitlements :- "$app" > "$RUNNER_TEMP/signed-entitlements.plist"
        python3 - <<'PY'
        import os
        import plistlib
        from pathlib import Path


        path = Path(os.environ['RUNNER_TEMP']) / 'signed-entitlements.plist'
        entitlements = plistlib.loads(path.read_bytes())
        containers = entitlements.get('com.apple.developer.icloud-container-identifiers', [])
        services = entitlements.get('com.apple.developer.icloud-services', [])
        print('Signed iCloud containers:', containers)
        print('Signed iCloud services:', services)
        assert 'iCloud.com.chaimalov.probablygroceries' in containers, 'Missing signed iCloud container'
        assert 'CloudKit' in services, 'Missing signed CloudKit service'
        assert entitlements.get('aps-environment') == 'production', 'Missing signed production push entitlement'
        groups = entitlements.get('com.apple.security.application-groups', [])
        assert 'group.com.chaimalov.probablygroceries' in groups, 'Missing app group entitlement'
        widget_path = Path(os.environ['RUNNER_TEMP']) / 'widget-entitlements.plist'
        widget_entitlements = plistlib.loads(widget_path.read_bytes())
        widget_groups = widget_entitlements.get('com.apple.security.application-groups', [])
        assert 'group.com.chaimalov.probablygroceries' in widget_groups, 'Missing widget app group'
        PY
        xcodebuild -exportArchive \
          -archivePath "$RUNNER_TEMP/ProbablyGroceries.xcarchive" \
          -exportPath "$RUNNER_TEMP/TestFlight" \
          -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
          -allowProvisioningUpdates \
          -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
          -authenticationKeyID "$APPLE_KEY_ID" \
          -authenticationKeyIssuerID "$APPLE_ISSUER_ID"
    - name: Remove temporary credentials
      if: always()
      run: rm -f "$RUNNER_TEMP/AuthKey.p8"
    timeout-minutes: 25
  processing:
    needs: upload
    if: >-
      always() && (needs.upload.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.existing_build != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TESTFLIGHT_BUILD_NUMBER: ${{ inputs.existing_build || github.run_number }}
      APPLE_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}
        persist-credentials: false
    - name: Check Apple processing
      shell: bash
      run: |
        set +x
        set -euo pipefail
        umask 077
        trap 'rm -f "$RUNNER_TEMP/AuthKey.p8"' EXIT
        printf '%s' "$APPLE_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
        unset APPLE_KEY_P8
        python3 scripts/wait_for_testflight.py
        python3 scripts/distribute_external.py
permissions:
  contents: read


