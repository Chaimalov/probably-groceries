name: Decision service
on:
  pull_request:
    paths: ['server/**', '.github/workflows/decision-service.yml']
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/decision-service.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: decision-service-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
        working-directory: server
      - run: npm run check
        working-directory: server
  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != '' && vars.DECISION_DATABASE_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DECISION_DATABASE_ID: ${{ vars.DECISION_DATABASE_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      INCEPTION_API_KEY: ${{ secrets.INCEPTION_API_KEY }}
      ADMIN_KEY: ${{ secrets.DECISION_ADMIN_KEY }}
      AUTO_LINK_ENABLED: ${{ vars.DECISION_AUTO_LINK_ENABLED || 'false' }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate deployment configuration
        run: |
          node --input-type=module - <<'JS'
          for (const key of ['CLOUDFLARE_API_TOKEN', 'INCEPTION_API_KEY', 'ADMIN_KEY']) {
            if (!process.env[key]) throw new Error(`Missing secret: ${key}`);
          }
          if (process.env.ADMIN_KEY.length < 32) throw new Error('DECISION_ADMIN_KEY must be at least 32 characters');
          JS
      - name: Prepare account-specific configuration
        run: |
          node --input-type=module - <<'JS'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'));
          config.d1_databases[0].database_id = process.env.DECISION_DATABASE_ID;
          config.vars.AUTO_LINK_ENABLED = process.env.AUTO_LINK_ENABLED === 'true' ? 'true' : 'false';
          fs.writeFileSync('wrangler.deploy.json', JSON.stringify(config));
          JS
      - name: Apply access database migrations
        run: npx --yes wrangler@4.152.0 d1 migrations apply groceries-decisions --remote --config wrangler.deploy.json
      - name: Deploy worker
        run: npx --yes wrangler@4.152.0 deploy --config wrangler.deploy.json
      - name: Configure provider secrets
        run: |
          node --input-type=module - <<'JS' | npx --yes wrangler@4.152.0 secret bulk --config wrangler.deploy.json
          process.stdout.write(JSON.stringify({ INCEPTION_API_KEY: process.env.INCEPTION_API_KEY, ADMIN_KEY: process.env.ADMIN_KEY }));
          JS
