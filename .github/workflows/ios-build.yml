name: iOS build
'on':
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', LICENSE]
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', LICENSE]
  workflow_dispatch:
    inputs:
      ui_tests:
        description: 'Run simulator UI tests (normally omitted)'
        type: choice
        default: none
        options: [none, shopping, preparation, drag, layout, fidelity, all]
concurrency:
  group: ios-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  checks:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Test domain directly on host — no simulator or app launch
      timeout-minutes: 3
      run: python3 scripts/test_domain.py
    # Main is compiled once by the Release archive in the deployment workflow.
    # PRs and manual checks still compile the full iOS app without booting iOS.
    - name: Install XcodeGen
      if: github.event_name != 'push'
      run: command -v xcodegen >/dev/null || brew install xcodegen
    - name: Generate project
      if: github.event_name != 'push'
      run: xcodegen generate
    - name: Compile iOS app without simulator boot
      if: github.event_name != 'push'
      timeout-minutes: 5
      run: |
        xcodebuild -quiet -project ProbablyGroceries.xcodeproj \
          -scheme ProbablyGroceries -configuration Debug \
          -destination 'generic/platform=iOS Simulator' \
          CODE_SIGNING_ALLOWED=NO build
    - name: Compile watch app without simulator boot
      if: github.event_name != 'push'
      timeout-minutes: 5
      run: |
        xcodebuild -quiet -project ProbablyGroceries.xcodeproj \
          -scheme GroceriesWatch -configuration Debug \
          -destination 'generic/platform=watchOS Simulator' \
          CODE_SIGNING_ALLOWED=NO build
  ui-tests:
    if: (github.event_name == 'workflow_dispatch' && inputs.ui_tests != 'none') || (github.event_name == 'pull_request' && (contains(github.event.pull_request.title, '[ui:layout]') || contains(github.event.pull_request.title, '[ui:fidelity]')))
    needs: checks
    runs-on: xcode-27
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        device: ${{ fromJSON((inputs.ui_tests == 'layout' || contains(github.event.pull_request.title, '[ui:layout]')) && '["iPhone","iPad"]' || '["iPhone"]') }}
    env:
      UI_SUITE: ${{ inputs.ui_tests || (contains(github.event.pull_request.title, '[ui:fidelity]') && 'fidelity' || 'layout') }}
      UI_DEVICE: ${{ matrix.device }}
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - name: Generate project
      run: |
        command -v xcodegen >/dev/null || brew install xcodegen
        xcodegen generate
    - name: Test selected shopping flow on simulator
      timeout-minutes: 10
      run: |
        set -euo pipefail
        if [ "$UI_SUITE" = fidelity ]; then
          # 393x852pt, matching the user's Reminders reference viewport.
          RUNTIME_ID=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r["name"].startswith("iOS 27") and r["isAvailable"]))')
          DEVICE_ID=$(xcrun simctl create 'Reminders Reference' com.apple.CoreSimulator.SimDeviceType.iPhone-15 "$RUNTIME_ID")
        else
        DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys,os; print(next(d["udid"] for runtime, group in json.load(sys.stdin)["devices"].items() if "iOS-27" in runtime for d in group if d["name"].startswith(os.environ["UI_DEVICE"])))')
        fi
        selection=("-only-testing:ProbablyGroceriesUITests")
        case "$UI_SUITE" in
          shopping) selection=("-only-testing:ProbablyGroceriesUITests/ProbablyGroceriesUITests/testInlineAddEnterPurchaseUndoAndPersistence") ;;
          fidelity) selection=("-only-testing:ProbablyGroceriesUITests/ProbablyGroceriesUITests/testRemindersFidelityAndStableCheckoff") ;;
          preparation) selection=("-only-testing:ProbablyGroceriesUITests/ProbablyGroceriesUITests/testPreparationCloseResumeExcludeAndConfirmOnce") ;;
          drag) selection=("-only-testing:ProbablyGroceriesUITests/ProbablyGroceriesUITests/testTouchAndHoldReordersWithoutBuyingAndSurvivesRelaunch") ;;
          layout)
            if [ "$UI_DEVICE" = iPhone ]; then
              selection=("-only-testing:ProbablyGroceriesUITests/ProbablyGroceriesUITests/testSectionCreationAndStoreSwitching")
            else
              selection=("-only-testing:ProbablyGroceriesUITests/ProbablyGroceriesUITests/testInlineEditorFocusAndAdaptiveLayout")
            fi
            ;;
          all) ;;
          *) exit 2 ;;
        esac
        # Compile before boot: a fresh simulator's services otherwise compete
        # with Swift for this small runner's CPU and memory.
        xcodebuild -quiet -project ProbablyGroceries.xcodeproj \
          -scheme ProbablyGroceriesUI -configuration Debug \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath "$RUNNER_TEMP/UIBuild" \
          CODE_SIGNING_ALLOWED=NO build-for-testing
        xcrun simctl bootstatus "$DEVICE_ID" -b
        xcodebuild -project ProbablyGroceries.xcodeproj \
          -scheme ProbablyGroceriesUI -configuration Debug \
          -derivedDataPath "$RUNNER_TEMP/UIBuild" \
          -destination "platform=iOS Simulator,id=$DEVICE_ID" \
          -parallel-testing-enabled NO \
          -collect-test-diagnostics never \
          -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
          "${selection[@]}" CODE_SIGNING_ALLOWED=NO test-without-building
    - name: Export screenshots
      if: success() || failure()
      run: |
        if [ -f "$RUNNER_TEMP/TestResults.xcresult/Info.plist" ]; then
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/TestResults.xcresult" --output-path "$RUNNER_TEMP/ui-screenshots"
        fi
    - uses: actions/upload-artifact@v4
      if: success() || failure()
      with:
        name: shopping-flow-screenshots-${{ matrix.device }}
        path: ${{ runner.temp }}/ui-screenshots
        if-no-files-found: ignore
        retention-days: 3
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: ui-test-results-${{ matrix.device }}
        path: ${{ runner.temp }}/TestResults.xcresult
        if-no-files-found: ignore
        retention-days: 3


